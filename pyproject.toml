[project]
name = "agent-v2"
version = "0.1.0"
description = "Second implementation skeleton for the ship energy optimization agent."
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.116.1",
  "langgraph==1.2.11",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.0",
]

[project.scripts]
agent-v2 = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["core", "tools", "schemas", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
