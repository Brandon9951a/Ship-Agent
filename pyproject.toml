[project]
name = "ship-agent"
version = "1.0.0"
description = "LangGraph-based voyage speed and energy management decision system."
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.116.1",
  "langgraph==1.2.11",
  "langgraph-checkpoint-postgres==3.1.2",
  "langgraph-checkpoint-sqlite==3.1.1",
  "psycopg[binary]>=3.2,<4",
  "uvicorn==0.35.0",
  "websocket-client>=1.8,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.0",
]

[project.scripts]
ship-agent = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["core", "tools", "schemas", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
